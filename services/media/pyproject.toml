[project]
name = "media"
version = "0.1.0"
description = "YouTube Music → Google Cast media sidecar"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "pychromecast>=14.0.10",
    "pydantic-settings>=2.14.0",
    "uvicorn[standard]>=0.46.0",
    "yt-dlp[default]>=2026.3.17",
    "ytmusicapi>=1.12.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "ytmusicapi.*",
    "pychromecast.*",
    "casttube.*",
    "yt_dlp.*",
]
ignore_missing_imports = true
